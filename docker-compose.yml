# Local MantisBT sandbox for trying out the QualificationTracker plugin.
#
#   docker compose up -d --build
#   -> MantisBT : http://localhost:8990   (finish the installer once)
#   -> Mailpit  : http://localhost:8026   (catches every outgoing e-mail)
#
# Different host ports than the IssueRecurrence sandbox (8989/8025/1025) so both
# can run side by side. See docker/README.md for the step-by-step walkthrough.

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: bugtracker
      MARIADB_USER: mantisbt
      MARIADB_PASSWORD: mantisbt
    volumes:
      - mantis_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mantis:
    build: ./docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8990:80"
    volumes:
      # The repository root IS the plugin, so mount it straight into MantisBT's
      # plugins directory under the plugin's basename.
      - .:/var/www/html/plugins/QualificationTracker
      # Pre-baked configuration (DB + Mailpit).
      - ./docker/config_inc.php:/var/www/html/config/config_inc.php

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"   # web UI
      - "1026:1025"   # SMTP

volumes:
  mantis_db:
